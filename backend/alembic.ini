# ==============================================================
# Alembic configuration for ClinicOS Voice
# Run from: backend/
# Commands:
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1
# ==============================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Prepend sys.path with this directory (relative to alembic.ini)
prepend_sys_path = .

# Timezone for migration timestamps
timezone = Asia/Kolkata

# Max length for long migration names
truncate_slug_length = 40

# Version path separator (os-default)
version_path_separator = os

# URL is set dynamically in env.py from DATABASE_URL_SYNC env var
# sqlalchemy.url =

[post_write_hooks]
# Run ruff format on new migration files
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
